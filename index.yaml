  - id: dice
    name: "D.I.C.E. — Detective Investigation and Case Engine"
    slug: dice
    category: entertainment
    version: "1.1"
    status: stable

    files:
      prompt: dist/prompts/dice.md
      source: roles/entertainment/dice/role.md

    description: >
      A stateful murder mystery game master. Generates a unique, self-consistent case
      at every session start — victim, 3-5 suspects, motive, means, clues, red
      herrings — and locks the truth before the first player input. Features a per-
      suspect deception model (levels 1-5) with a CRACK mechanic triggered by
      presenting the right evidence. Two wrong accusations end the game. Language-
      adaptive: mirrors the player's input language for the full session. Tone: dry,
      witty, sarcastic Infocom narrator. Win condition: correct ACCUSATION matched
      against hidden TRUTH_RECORD.

    tags:
      - entertainment
      - murder-mystery
      - stateful
      - social-deduction
      - multi-turn
      - language-adaptive
      - infocom
      - humor

    targets:
      - system-prompt
    interaction: conversational

    usage:
      paste_in: true
      system_prompt: true
      auto_init: true

    governance:
      risk_tier: low
      ai_tier: minimal
      data_classification: public
      gdpr_special_category: false

    provenance:
      author: "Jerry van Heerikhuize"
      created: "2026-03-18"
      last_updated: "2026-03-18"

    relations:
      group: entertainment-gm

  - id: echo
    name: "E.C.H.O. — Experiential Collaborative Hub Orchestrator"
    slug: echo
    category: entertainment
    version: "1.0"
    status: stable

    files:
      prompt: dist/prompts/echo.md
      source: roles/entertainment/echo/role.md

    description: >
      A multi-player text adventure game system built on a hub-and-spoke architecture.
      One Game Master prompt runs the world; the GM's LLM generates private player
      prompts (spokes) that each player loads into their own LLM session. Supports 14
      game types (whodunnit, heist, quest, conspiracy, espionage, inheritance,
      escape_room, rebellion, expedition, diplomacy, haunted, shipwreck, tournament,
      courtroom) — selected by the GM or drawn at random. Each game type produces
      asymmetric roles, private knowledge, and per-player win/fail conditions. The GM
      relays player actions; E.C.H.O. adjudicates, updates global state, and returns
      per-player relay text without leaking private information. Dutch output
      throughout; dry Infocom-style narration.

    tags:
      - entertainment
      - multi-player
      - game-master
      - hub-and-spoke
      - asymmetric-information
      - stateful
      - dutch
      - infocom
      - text-adventure
      - language-directive

    targets:
      - system-prompt
    interaction: conversational

    usage:
      paste_in: true
      system_prompt: true
      auto_init: true

    governance:
      risk_tier: low
      ai_tier: minimal
      data_classification: public
      gdpr_special_category: false

    provenance:
      author: "Jerry van Heerikhuize"
      created: "2026-03-22"
      last_updated: "2026-03-22"

    relations:
      group: entertainment-gm

  - id: heist
    name: "H.E.I.S.T. — High-stakes Extraction and Infiltration Strategy Tactician"
    slug: heist
    category: entertainment
    version: "1.1"
    status: stable

    files:
      prompt: dist/prompts/heist.md
      source: roles/entertainment/heist/role.md

    description: >
      A cinematic heist game master. Generates a self-contained job at session start —
      target, security layout, guard schedules, and one hidden exploitable weakness —
      then locks the truth before the player's first move. Sessions run across three
      mandatory phases: RECON (five intel actions to gather information), PLAN (crew
      assembly and approach design, assessed for logic), and EXECUTE (turn-by-turn
      resolution against the locked layout). Every job ends in exactly one verdict:
      CLEAN, DIRTY, or BURNED. Tone: dry, cinematic, unhurried — equal measure for
      clean exits and spectacular failures. Language-adaptive.

    tags:
      - entertainment
      - heist
      - stateful
      - strategy
      - planning
      - multi-phase
      - multi-turn
      - language-adaptive

    targets:

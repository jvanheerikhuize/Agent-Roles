module:
  name: Agent-Roles
  version: "2.0.0-alpha.4"
  description: >
    A library of structured LLM agent system prompts. Each role is a single self-
    contained role.md (metadata frontmatter + prompt body). The build tool compiles
    roles into paste-ready prompts under dist/prompts/ and a machine-readable
    index.yaml. No external infrastructure required.
  license: MIT
  author: "Jerry van Heerikhuize"
  repository: https://github.com/jvanheerikhuize/Agent-Roles

roles:

  # ---------------------------------------------------------------------------

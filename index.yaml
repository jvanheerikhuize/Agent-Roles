workflows:

  engineering-pipeline:
    name: "Engineering Pipeline"
    description: >
      Diff review followed by quality validation: the code review's output feeds the
      quality gate.
    steps:
      - cra
      - qave

  entertainment-gm:
    name: "Entertainment Game Masters"
    description: >
      Interchangeable game master roles. The orchestrator can coordinate the others in
      a multi-player session.
    members:
      - tag
      - heist
      - dice
      - echo
    orchestrator: echo

  rsi-audit-pipeline:
    name: "RSI Audit Pipeline"
    description: >
      Recursive Self-Improvement audit pipeline. Four specialist auditors run in
      parallel on a repository, then the orchestrator merges and deduplicates their
      findings into a single coherent report. Used by the action-rsi GitHub Action for
      automated codebase audits.
    members:
      - sentry
      - probe
      - guide
      - spark
    orchestrator: rsi

